name: Compile and Run Java TVMerge

on:
  schedule:
    - cron: '0 11 * * *'  # 每天北京时间19:00（UTC +8)
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write  # 允许 workflow push 和创建 PR

jobs:
  run-tv:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Compile Java TVMerge
      run: javac TVMerge.java

    - name: Run crawler
      run: java TVMerge

    - name: Commit changes to tmp branch
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B tmp
        git add tv_auto.txt
        git commit -m "Update TV crawler results [skip ci]" || echo "No changes to commit"
        git push --set-upstream origin tmp -f
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install GitHub CLI
      run: sudo apt-get update && sudo apt-get install -y gh

    - name: Create and merge PR to main
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
        # 创建 PR
        gh pr create \
          --title "Update TV Merge results" \
          --body "Auto-generated by workflow" \
          --head tmp \
          --base main \
          --repo ${{ github.repository }}
        # 自动 merge
        gh pr merge tmp --merge --repo ${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}