name: EPG Mirror

on:
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install file
        run: sudo apt-get update && sudo apt-get install -y file

      - name: Download EPG
        run: |
          # 在这里加源：文件名 和 URL 一一对应
          declare -A SOURCES=(
            ["51zmt-e.xml"]="http://epg.51zmt.top:8000/e.xml.gz"
            ["51zmt-e2.xml"]="http://epg.51zmt.top:8000/e2.xml.gz"
          )

          for filename in "${!SOURCES[@]}"; do
            url="${SOURCES[$filename]}"
            echo "Downloading $filename from $url"
            raw="$filename.raw"
            curl -kL --retry 5 -o "$raw" "$url" || { echo "下载失败 $filename"; rm -f "$raw"; continue; }

            # gzip 自动解压
            if [[ "$(file -b --mime-type "$raw")" == application/*gzip ]]; then
              gunzip -c "$raw" > "$filename"
            else
              mv "$raw" "$filename"
            fi
            rm -f "$raw"
          done

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(date '+%Y-%m-%d %H:%M')"
          git push
