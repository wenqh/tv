name: Sync EPG

on:
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file

      - name: Download EPG
        run: |
          mkdir -p epg

          download() {
            filename="$1"
            url="$2"

            echo "==== $filename ===="

            raw="epg/${filename}.raw"
            tmp="epg/${filename}.tmp"
            out="epg/${filename}"

            http=$(curl -L \
              --retry 5 \
              --connect-timeout 15 \
              --max-time 300 \
              -A "Mozilla/5.0" \
              -sS \
              -w "%{http_code}" \
              -o "$raw" \
              "$url")

            if [ "$http" != "200" ]; then
              echo "Download failed: HTTP $http"
              rm -f "$raw"
              return
            fi

            mime=$(file -b --mime-type "$raw")

            if [[ "$mime" == application/gzip* ]]; then
              gunzip -c "$raw" > "$tmp"
            else
              mv "$raw" "$tmp"
            fi

            rm -f "$raw"

            if [ ! -f "$out" ] || ! cmp -s "$tmp" "$out"; then
              mv "$tmp" "$out"
              gzip -kf "$out"
              echo "Updated"
            else
              rm -f "$tmp"
              echo "No change"
            fi
          }

          # ===== 在这里添加源 =====
          download "e2.xml" "http://epg.51zmt.top:8000/e2.xml.gz"
          # download "tv.xml" "https://example.com/tv.xml"
          # download "hk.xml" "https://example.com/hk.xml.gz"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg

          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi

          git commit -m "Update EPG $(date '+%F %T')"
          git push